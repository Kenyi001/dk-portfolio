<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="4" fill="#1A1D24"/>

  <!-- D: cream, bold — stem + bowl exterior + bowl cutout -->
  <path d="M2.5 3.5 L2.5 28.5 L10.5 28.5 Q19 28.5 19 16 Q19 3.5 10.5 3.5 Z" fill="#E8E0D4"/>
  <path d="M6.5 7.5 L10 7.5 Q14 7.5 14 16 Q14 24.5 10 24.5 L6.5 24.5 Z" fill="#1A1D24"/>

  <!-- K: red — stem + dos brazos anchos con muesca visible -->
  <rect x="20.5" y="3.5" width="3.5" height="25" fill="#D4513A"/>
  <!-- Brazo superior: triángulo grueso hasta y=12.5 (termina arriba, no en el centro) -->
  <polygon points="24,3.5  30,3.5  24,12.5" fill="#D4513A"/>
  <!-- Brazo inferior: triángulo grueso desde y=19.5 (empieza abajo, no en el centro) -->
  <polygon points="24,19.5  30,28.5  24,28.5" fill="#D4513A"/>
</svg>
